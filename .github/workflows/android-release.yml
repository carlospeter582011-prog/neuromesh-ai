name: Android release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      play_bundle_only:
        description: Build and verify a development-signed Play AAB artifact
        type: boolean
        default: false
      preview_only:
        description: Test Android and desktop packages with development signing and upload them to Actions
        type: boolean
        default: false

# Serialize main release builds so publication and Latest selection agree.
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NEUROMESH_REPORT_ENDPOINT: ${{ !inputs.preview_only && !inputs.play_bundle_only && vars.NEUROMESH_REPORT_ENDPOINT || '' }}
  NEUROMESH_REPORT_BOT_TOKEN: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.NEUROMESH_REPORT_BOT_TOKEN || '' }}
  NEUROMESH_REPORT_CHAT_ID: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.NEUROMESH_REPORT_CHAT_ID || '' }}
  REQUIRE_DEVELOPER_REPORT_DELIVERY: ${{ !inputs.preview_only && !inputs.play_bundle_only && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
  BASE_VERSION: "2.0"   # MAJOR.MINOR; patch comes from the CI run number
  ANDROID_VERSION_CODE_BASE: 5000   # Exceed legacy split-ABI APK version codes (including 4072)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.name }}
      production_signed: ${{ steps.sign.outputs.production }}
      standalone_channel: ${{ steps.standalone_sign.outputs.channel }}
      aab_mb: ${{ steps.play_size.outputs.aab_mb }}
      split_mb: ${{ steps.play_size.outputs.split_mb }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Install modern glslc (Vulkan shader compiler)
        run: |
          # The NDK's bundled glslc is too old for the cooperative-matrix shaders in llama.cpp's Vulkan backend.
          mkdir -p "$RUNNER_TEMP/vksdk" && cd "$RUNNER_TEMP/vksdk"
          curl -fsSL --retry 3 https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz
          GLSLC=$(find . -type f -name glslc -path '*x86_64/bin/*' | head -1)
          test -n "$GLSLC" || { echo "glslc not found in SDK"; ls; exit 1; }
          sudo ln -sf "$(realpath "$GLSLC")" /usr/local/bin/glslc
          echo "VULKAN_SDK=$(dirname "$(dirname "$(realpath "$GLSLC")")")" >> "$GITHUB_ENV"
          glslc --version

      - name: Compute version
        id: ver
        run: |
          echo "name=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=$((ANDROID_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Prepare signing
        id: sign
        env:
          KS_B64: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KS_PASS: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASS: ${{ !inputs.preview_only && !inputs.play_bundle_only && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            echo "$KS_B64" | base64 -d > android/release.jks
            {
              echo "storePassword=$KS_PASS"
              echo "keyPassword=$KEY_PASS"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=$GITHUB_WORKSPACE/android/release.jks"
            } > android/key.properties
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            # AAB-only builds do not reliably create Gradle's default debug key.
            # Use one explicit ephemeral signer for both the AAB and its APKs.
            keytool -genkeypair -noprompt -keystore android/release.jks -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NeuroMesh Development,O=NeuroMesh,C=US"
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=androiddebugkey"
              echo "storeFile=$GITHUB_WORKSPACE/android/release.jks"
            } > android/key.properties
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Building DEVELOPMENT-signed artifacts."
          fi

      - name: Private developer report configuration
        run: python scripts/report_build_config.py "$RUNNER_TEMP/neuromesh-report-defines.json"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: |
          python -m unittest discover -s scripts -p 'test_report_build_config.py'
          flutter test

      - name: OpenCode local-provider protocol smoke test on Linux
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opencode"
          archive="$RUNNER_TEMP/opencode/archive.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            https://github.com/anomalyco/opencode/releases/download/v1.19.6/opencode-linux-x64.tar.gz
          echo "47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/opencode" opencode
          NEUROMESH_TEST_OPENCODE_CLI="$RUNNER_TEMP/opencode/opencode" \
            flutter test --no-pub test/openai_server_service_test.dart
          rm -rf "$RUNNER_TEMP/opencode"

      - name: Fetch proot (Termux build for Android)
        if: github.event_name != 'pull_request'
        run: |
          set -e
          BASE=https://packages.termux.dev/apt/termux-main
          mkdir -p proot_dl && cd proot_dl
          curl -fsSL --retry 3 "$BASE/dists/stable/main/binary-aarch64/Packages" -o Packages
          debfor() { awk -v p="$1" 'BEGIN{RS="";FS="\n"} $1=="Package: " p {for(i=1;i<=NF;i++) if($i ~ /^Filename: /){sub("Filename: ","",$i); print $i}}' Packages | head -1; }
          for pkg in proot libtalloc libandroid-shmem; do
            f=$(debfor $pkg); test -n "$f" || { echo "package $pkg not found"; exit 1; }
            curl -fsSL --retry 3 "$BASE/$f" -o $pkg.deb
            mkdir -p x_$pkg && (cd x_$pkg && ar x ../$pkg.deb && tar -xf data.tar.* )
          done
          J=../android/app/src/main/jniLibs/arm64-v8a
          mkdir -p $J
          cp "$(find x_proot -type f -name proot | head -1)" $J/libproot.so
          cp "$(find x_proot -type f -path '*libexec/proot/loader' | head -1)" $J/libproot_loader.so
          cp "$(find x_libtalloc -type f -name 'libtalloc.so*' | head -1)" $J/libtalloc.so
          cp "$(find x_libandroid-shmem -type f -name libandroid-shmem.so | head -1)" $J/libandroid-shmem.so
          ls -la $J

      - name: Resolve Flutter Gradle plugin dependencies from Maven Central
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PYTHON'
          import shutil
          from pathlib import Path

          flutter = Path(shutil.which("flutter")).resolve()
          settings = flutter.parent.parent / "packages/flutter_tools/gradle/settings.gradle.kts"
          original = settings.read_text()
          if "pluginManagement {" not in original:
              settings.write_text(
                  "pluginManagement {\n"
                  "    repositories {\n"
                  "        mavenCentral()\n"
                  "        gradlePluginPortal()\n"
                  "    }\n"
                  "}\n\n" + original
              )
          PYTHON

      # Google Play build: no self-updater and none of the restricted permissions
      # (all-files access, install packages, battery-optimisation exemption).
      - name: Build Play AAB
        if: github.event_name != 'pull_request'
        env:
          NEUROMESH_PLAY_BUNDLE: 'true'
          NEUROMESH_ALLOW_DEBUG_RELEASE_SIGNING: ${{ steps.sign.outputs.production == 'true' && 'false' || 'true' }}
          BUILD_NAME: ${{ steps.ver.outputs.name }}
          BUILD_NUMBER: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          M=android/app/src/main/AndroidManifest.xml
          sed -i -E '/MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|WRITE_EXTERNAL_STORAGE|READ_EXTERNAL_STORAGE/d' "$M"
          # Flutter 3.38's appbundle command expects a bundled libflutter.so.sym
          # even when AGP strips the library and intentionally omits the metadata.
          flutter build apk --release --config-only --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          dart_defines=$(python - "$RUNNER_TEMP/neuromesh-report-defines.json" <<'PYTHON'
          import base64
          import json
          import sys

          with open(sys.argv[1]) as file:
              defines = json.load(file)
          defines['PLAY_BUILD'] = 'true'
          print(','.join(base64.b64encode(f'{key}={value}'.encode()).decode()
                         for key, value in defines.items()))
          PYTHON
          )
          cd android
          ./gradlew -q :app:bundleRelease -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Ptarget=lib/main.dart -Pbase-application-name=android.app.Application \
            -Ptree-shake-icons=true "-Pdart-defines=$dart_defines"

      - name: Play policy and size check
        id: play_size
        if: github.event_name != 'pull_request'
        run: |
          set -e
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          AAB=build/app/outputs/bundle/release/app-release.aab
          python scripts/check_play_bundle.py "$AAB"
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/bundle-signature.txt"
          grep -Fx 'jar verified.' "$RUNNER_TEMP/bundle-signature.txt"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for library in libapp.so libflutter.so; do
              unzip -p "$AAB" "base/lib/$abi/$library" > "$RUNNER_TEMP/bundle-library.so"
              readelf --wide --sections "$RUNNER_TEMP/bundle-library.so" > "$RUNNER_TEMP/bundle-sections.txt"
              if grep -Eq '[[:space:]]\.(z?debug_[[:alnum:]_]+|symtab)[[:space:]]' "$RUNNER_TEMP/bundle-sections.txt"; then
                echo "::error::Unstripped library: $abi/$library"; exit 1
              fi
            done
          done
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$AAB" > "$RUNNER_TEMP/bundle-validation.txt"
          package_id=$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" --xpath='/manifest/@package')
          test "$package_id" = com.neuromesh.ai
          # 1) The merged manifest must not contain restricted permissions.
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$AAB" > "$RUNNER_TEMP/manifest.xml"
          if grep -E 'MANAGE_EXTERNAL_STORAGE|REQUEST_INSTALL_PACKAGES|REQUEST_IGNORE_BATTERY_OPTIMIZATIONS|SYSTEM_ALERT_WINDOW|READ_SMS|READ_CALL_LOG|QUERY_ALL_PACKAGES|ACCESS_BACKGROUND_LOCATION' "$RUNNER_TEMP/manifest.xml"; then
            echo "::error::Play-restricted permission found in the AAB manifest"; exit 1
          fi
          echo "Permissions in the Play build:"; grep -o 'android.permission.[A-Z_]*' "$RUNNER_TEMP/manifest.xml" | sort -u
          # 2) Download size AFTER Play splits the bundle (arm64 phone, typical density).
          cat > "$RUNNER_TEMP/spec.json" <<'EOF2'
          {"supportedAbis":["arm64-v8a","armeabi-v7a"],"supportedLocales":["en","ar"],"screenDensity":480,"sdkVersion":34}
          EOF2
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$AAB" --output="$RUNNER_TEMP/out.apks" --device-spec="$RUNNER_TEMP/spec.json" --overwrite
          SIZE=$(java -jar "$RUNNER_TEMP/bundletool.jar" get-size total --apks="$RUNNER_TEMP/out.apks" --device-spec="$RUNNER_TEMP/spec.json" | tail -1 | awk -F, '{print $2}' | tr -dc 0-9)
          AABSZ=$(stat -Lc%s "$AAB")
          test -n "$SIZE"
          echo "Download size on an arm64 phone after Play splitting: $SIZE bytes"
          LC_ALL=C awk -v raw_bytes="$AABSZ" -v split_bytes="$SIZE" \
            'BEGIN {printf "aab_mb=%.2f\nsplit_mb=%.2f\n", raw_bytes/1e6, split_bytes/1e6}' >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -gt 198000000 ]; then
            echo "::error::Over the Play 200 MB limit"; exit 1
          fi
          if [ "$SIZE" -gt 170000000 ]; then echo "::warning::Download size is close to the Play limit"; fi

      - name: Configure persistent GitHub APK signer
        id: standalone_sign
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only
        env:
          UPDATE_KEYSTORE: ${{ !inputs.preview_only && secrets.ANDROID_UPDATE_KEYSTORE_BASE64 || '' }}
          UPDATE_PASSWORD: ${{ !inputs.preview_only && secrets.ANDROID_UPDATE_KEYSTORE_PASSWORD || '' }}
          UPDATE_ALIAS: ${{ !inputs.preview_only && secrets.ANDROID_UPDATE_KEY_ALIAS || '' }}
          UPDATE_KEY_PASSWORD: ${{ !inputs.preview_only && secrets.ANDROID_UPDATE_KEY_PASSWORD || '' }}
          UPDATE_CERT: ${{ !inputs.preview_only && vars.ANDROID_UPDATE_CERT_SHA256 || '' }}
        run: |
          set -euo pipefail
          if [ -n "$UPDATE_KEYSTORE$UPDATE_PASSWORD$UPDATE_ALIAS$UPDATE_KEY_PASSWORD$UPDATE_CERT" ]; then
            if [[ -z "$UPDATE_KEYSTORE" || -z "$UPDATE_PASSWORD" || -z "$UPDATE_ALIAS" || -z "$UPDATE_KEY_PASSWORD" || ! "$UPDATE_CERT" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::Configure the complete persistent Android update signer and its certificate pin."
              exit 1
            fi
            printf '%s' "$UPDATE_KEYSTORE" | base64 -d > android/github-release.jks
            {
              printf 'storePassword=%s\n' "$UPDATE_PASSWORD"
              printf 'keyPassword=%s\n' "$UPDATE_KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$UPDATE_ALIAS"
              printf 'storeFile=%s\n' "$GITHUB_WORKSPACE/android/github-release.jks"
            } > android/key.properties
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          else
            test_keystore="$RUNNER_TEMP/neuromesh-test-signing.p12"
            fingerprint=$(bash scripts/create_public_test_keystore.sh "$test_keystore")
            {
              echo 'storePassword=android'
              echo 'keyPassword=android'
              echo 'keyAlias=neuromesh-test'
              printf 'storeFile=%s\n' "$test_keystore"
            } > android/key.properties
            echo "channel=public-test" >> "$GITHUB_OUTPUT"
            echo "test_cert=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing the isolated NeuroMesh AI Test APKs with a reusable public test certificate."
          fi

      - name: Standalone APKs from the normal release configuration
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only
        env:
          NEUROMESH_PUBLIC_TEST_APK: ${{ steps.standalone_sign.outputs.channel == 'public-test' && 'true' || 'false' }}
          UPDATE_CERT: ${{ !inputs.preview_only && vars.ANDROID_UPDATE_CERT_SHA256 || '' }}
          TEST_CERT: ${{ steps.standalone_sign.outputs.test_cert }}
        run: |
          set -euo pipefail
          git show HEAD:android/app/src/main/AndroidManifest.xml > android/app/src/main/AndroidManifest.xml
          V=(--build-name='${{ steps.ver.outputs.name }}' --build-number='${{ steps.ver.outputs.code }}')
          NEUROMESH_ARM64_APK_ONLY=true flutter build apk --release --target-platform android-arm64 "--dart-define-from-file=$RUNNER_TEMP/neuromesh-report-defines.json" --dart-define=PLAY_BUILD=false "${V[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/arm64.apk"
          flutter build apk --release "--dart-define-from-file=$RUNNER_TEMP/neuromesh-report-defines.json" --dart-define=PLAY_BUILD=false "${V[@]}"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/universal.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/universal.apk" > "$RUNNER_TEMP/universal-signature.txt"
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/arm64.apk" > "$RUNNER_TEMP/arm64-signature.txt"
          sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/universal-signature.txt" | sort -u > "$RUNNER_TEMP/universal-cert.txt"
          sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/arm64-signature.txt" | sort -u > "$RUNNER_TEMP/arm64-cert.txt"
          test -s "$RUNNER_TEMP/universal-cert.txt"
          test -s "$RUNNER_TEMP/arm64-cert.txt"
          diff "$RUNNER_TEMP/universal-cert.txt" "$RUNNER_TEMP/arm64-cert.txt"
          if [ -n "$UPDATE_CERT" ]; then
            printf '%s\n' "${UPDATE_CERT,,}" | diff - "$RUNNER_TEMP/arm64-cert.txt"
          fi
          package_id=com.neuromesh.ai
          if [[ "$NEUROMESH_PUBLIC_TEST_APK" == 'true' ]]; then
            package_id+=.test
            printf '%s\n' "$TEST_CERT" | diff - "$RUNNER_TEMP/arm64-cert.txt"
          fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$AAPT" dump badging "$RUNNER_TEMP/arm64.apk" > "$RUNNER_TEMP/arm64-package.txt"
          "$AAPT" dump badging "$RUNNER_TEMP/universal.apk" > "$RUNNER_TEMP/universal-package.txt"
          grep -F "package: name='$package_id' " "$RUNNER_TEMP/arm64-package.txt"
          grep -F "package: name='$package_id' " "$RUNNER_TEMP/universal-package.txt"
          sed 's/[[:space:]]*$//' "$RUNNER_TEMP/arm64-package.txt" | grep -Fx "native-code: 'arm64-v8a'"
          for library in libproot.so libproot_loader.so libtalloc.so libandroid-shmem.so; do
            unzip -l "$RUNNER_TEMP/arm64.apk" "lib/arm64-v8a/$library"
            unzip -l "$RUNNER_TEMP/universal.apk" "lib/arm64-v8a/$library"
          done
          # The compiler is no longer needed; leave room for the emulator image.
          rm -rf "$RUNNER_TEMP/vksdk"

      - name: Collect and verify artifacts
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only
        run: |
          set -e
          V='${{ steps.ver.outputs.name }}'
          apk_suffix=""; [ '${{ steps.standalone_sign.outputs.channel }}' = 'stable' ] || apk_suffix="-dev"
          aab_suffix=""; [ '${{ steps.sign.outputs.production }}' = 'true' ] || aab_suffix="-dev"
          mkdir -p dist
          cp "$RUNNER_TEMP/arm64-cert.txt" dist/android-apk-signer.txt
          cp "$RUNNER_TEMP/arm64.apk" "dist/NeuroMesh-AI-v${V}-arm64${apk_suffix}.apk"
          cp "$RUNNER_TEMP/universal.apk" "dist/NeuroMesh-AI-v${V}-universal${apk_suffix}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/NeuroMesh-AI-v${V}${aab_suffix}.aab"
          for f in dist/*; do test -s "$f" || { echo "empty artifact $f"; exit 1; }; done
          for f in dist/*.apk; do unzip -tq "$f"; done
          unzip -tq dist/*.aab

      - name: Enable emulator acceleration
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 12 clean install and upgrade smoke test
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only && steps.standalone_sign.outputs.channel == 'stable'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install "$RUNNER_TEMP/universal.apk"
            adb shell pm path com.neuromesh.ai | grep -F 'package:'
            adb install -r "$RUNNER_TEMP/universal.apk"

      - name: Android test APK upgrade and Play split coexistence
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only && steps.standalone_sign.outputs.channel == 'public-test'
        env:
          ANDROID_BUILD_NUMBER: ${{ steps.ver.outputs.code }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/smoke_android_packages.sh

      - name: Preview Android checksums
        if: inputs.preview_only && !inputs.play_bundle_only
        run: |
          cd dist
          sha256sum -- *.apk *.aab > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt

      - name: Upload ARM64 preview APK
        if: inputs.preview_only && !inputs.play_bundle_only
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk
          path: dist/*-arm64-dev.apk
          if-no-files-found: error

      - name: Upload universal preview APK
        if: inputs.preview_only && !inputs.play_bundle_only
        uses: actions/upload-artifact@v4
        with:
          name: android-universal-apk
          path: dist/*-universal-dev.apk
          if-no-files-found: error

      - name: Upload preview Play AAB
        if: inputs.preview_only && !inputs.play_bundle_only
        uses: actions/upload-artifact@v4
        with:
          name: android-play-aab
          path: dist/*-dev.aab
          if-no-files-found: error

      - name: Upload preview Android checksums
        if: inputs.preview_only && !inputs.play_bundle_only
        uses: actions/upload-artifact@v4
        with:
          name: android-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Upload verified Play bundle
        if: inputs.play_bundle_only
        uses: actions/upload-artifact@v4
        with:
          name: play-aab-size-check
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Keep package evidence if a validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-package-debug
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
            ${{ runner.temp }}/*signature.txt
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && !inputs.play_bundle_only && !inputs.preview_only
        with:
          name: neuromesh-ai-${{ steps.ver.outputs.name }}
          path: dist/*
          if-no-files-found: error

  # Windows and Linux desktop builds. They bundle llama.cpp's llama-server (CPU)
  # next to the app; the AI's shell commands use the computer's own shell.
  desktop:
    if: github.event_name != 'pull_request' && !inputs.play_bundle_only
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Compute desktop version
        shell: bash
        run: echo "RELEASE_VERSION=${BASE_VERSION}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.x
          channel: stable
          cache: true

      - name: Linux build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev libasound2-dev libsecret-1-dev
            liblzma-dev libayatana-appindicator3-dev libmpv-dev libgstreamer1.0-dev
            libgstreamer-plugins-base1.0-dev)
          apt_options=(-o Acquire::Retries=1 -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12)
          fetch_packages() {
            sudo timeout --kill-after=20s 150s apt-get "${apt_options[@]}" update &&
              sudo timeout --kill-after=20s 360s apt-get "${apt_options[@]}" install \
                -y --download-only --no-install-recommends "${packages[@]}"
          }
          if ! fetch_packages; then
            echo "::warning::Runner Ubuntu mirror stalled. Trying a signed Ubuntu archive mirror."
            source_list="$RUNNER_TEMP/ubuntu-fallback.list"
            for suite in noble noble-updates noble-security; do
              echo "deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://mirror.math.princeton.edu/pub/ubuntu/ $suite main restricted universe multiverse"
            done > "$source_list"
            apt_options+=(-o "Dir::Etc::sourcelist=$source_list" -o Dir::Etc::sourceparts=-)
            fetch_packages
          fi
          sudo DEBIAN_FRONTEND=noninteractive timeout --kill-after=20s 480s apt-get \
            "${apt_options[@]}" install -y --no-download --no-install-recommends "${packages[@]}"
          flutter config --enable-linux-desktop

      - name: Windows desktop
        if: runner.os == 'Windows'
        run: flutter config --enable-windows-desktop

      - name: Add desktop platform folders
        run: flutter create --platforms=windows,linux --project-name neuromesh_ai --org com.neuromesh .

      - run: flutter pub get

      - name: Private developer report configuration
        shell: bash
        run: python scripts/report_build_config.py "$RUNNER_TEMP/neuromesh-report-defines.json"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: flutter build linux --release "--dart-define-from-file=$RUNNER_TEMP/neuromesh-report-defines.json" --build-name=${{ env.RELEASE_VERSION }} --build-number=${{ github.run_number }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release "--dart-define-from-file=$env:RUNNER_TEMP/neuromesh-report-defines.json" --build-name=${{ env.RELEASE_VERSION }} --build-number=${{ github.run_number }}

      - name: Build and install the desktop image runtime
        shell: bash
        run: |
          set -e
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            bundle="$PWD/build/windows/x64/runner/Release"
            library=neuromesh_sd.dll
          else
            bundle="$PWD/build/linux/x64/release/bundle"
            library=libneuromesh_sd.so
          fi
          cmake -S local_plugins/sd_flutter_android/desktop -B build/desktop-image -DCMAKE_BUILD_TYPE=Release
          cmake --build build/desktop-image --config Release --parallel 2
          ctest --test-dir build/desktop-image -C Release --output-on-failure
          cmake --install build/desktop-image --config Release --prefix "$bundle"
          test -s "$bundle/native/$library"

      - name: Bundle llama-server and package (Linux)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="$RELEASE_VERSION"
          B=build/linux/x64/release/bundle
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*ubuntu*x64*' --pattern '*linux*x64*' --dir dl || true
          ls dl
          mkdir -p dl/x
          for f in dl/*; do case "$f" in *.zip) unzip -q -o "$f" -d dl/x;; *.tar.gz) tar -xzf "$f" -C dl/x;; esac; done
          test -n "$(find dl/x -name llama-server | head -1)" || { echo "llama-server not in archive"; find dl/x | head; exit 1; }
          cp -r $(dirname "$(find dl/x -name llama-server | head -1)")/* "$B/llama/"
          chmod +x "$B/llama/llama-server"
          ls "$B/llama" | head -20
          tar -C "$B" -czf "NeuroMesh-AI-v${V}-linux-x64.tar.gz" .
          bash scripts/package_linux.sh "$B" "$V" web/icons/Icon-512.png

      - name: Bundle llama-server and package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="$RELEASE_VERSION"
          B=build/windows/x64/runner/Release
          mkdir -p "$B/llama" dl
          TAG=$(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName -q '.[].tagName' | grep -E '^b[0-9]+$' | head -1); echo "llama.cpp $TAG"
          gh release download "$TAG" --repo ggml-org/llama.cpp --pattern '*win*cpu*x64*' --dir dl
          ls dl
          mkdir -p dl/x
          for f in dl/*.zip; do unzip -q -o "$f" -d dl/x; done
          cp -r $(dirname "$(find dl/x -name llama-server.exe | head -1)")/* "$B/llama/"
          ls "$B/llama" | head -20
          powershell -Command "Compress-Archive -Path '$B/*' -DestinationPath 'NeuroMesh-AI-v${V}-windows-x64-portable.zip'"
          # Real installer (Start-menu entry, uninstaller) built with Inno Setup.
          choco install innosetup -y --no-progress
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          export MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL="*"
          "$ISCC" "/DAppVersion=${V}" "/DSourceDir=$(cygpath -w "$PWD/$B")" "/DOutDir=$(cygpath -w "$PWD")" installer/neuromesh.iss
          ls -la NeuroMesh-AI-Setup-*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: neuromesh-ai-${{ runner.os }}-x64
          path: NeuroMesh-AI-*x64*
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.play_bundle_only && !inputs.preview_only
    needs: [build, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      PRODUCTION_SIGNED: ${{ needs.build.outputs.production_signed }}
      STANDALONE_CHANNEL: ${{ needs.build.outputs.standalone_channel }}
      AAB_MB: ${{ needs.build.outputs.aab_mb }}
      SPLIT_MB: ${{ needs.build.outputs.split_mb }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: neuromesh-ai-*
          path: packages

      - name: Verify all release installers and generate checksums
        run: |
          set -euo pipefail
          apk_suffix=""; [ "$STANDALONE_CHANNEL" = 'stable' ] || apk_suffix="-dev"
          aab_suffix=""; [ "$PRODUCTION_SIGNED" = 'true' ] || aab_suffix="-dev"

          android="packages/neuromesh-ai-$VERSION"
          windows="packages/neuromesh-ai-Windows-x64"
          linux="packages/neuromesh-ai-Linux-x64"
          installers=(
            "$android/NeuroMesh-AI-v$VERSION-arm64$apk_suffix.apk"
            "$android/NeuroMesh-AI-v$VERSION-universal$apk_suffix.apk"
            "$android/NeuroMesh-AI-v$VERSION$aab_suffix.aab"
            "$windows/NeuroMesh-AI-Setup-v$VERSION-x64.exe"
            "$linux/NeuroMesh-AI-v$VERSION-linux-x64.deb"
            "$linux/NeuroMesh-AI-v$VERSION-linux-x64.AppImage"
          )
          mkdir -p dist
          for installer in "${installers[@]}"; do
            if [[ ! -s "$installer" ]]; then
              echo "::error::Missing or empty release installer: $installer"
              exit 1
            fi
            cp "$installer" dist/
          done
          APK_SIGNER=$(cat "$android/android-apk-signer.txt")
          [[ "$APK_SIGNER" =~ ^[a-f0-9]{64}$ ]]
          echo "APK_SIGNER=$APK_SIGNER" >> "$GITHUB_ENV"
          cd dist
          sha256sum -- *.apk *.aab *.exe *.deb *.AppImage > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish and verify the versioned GitHub Release
        run: bash scripts/publish_github_release.sh
